<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" font-family="Segoe UI, Arial, sans-serif" fill="#1A202C">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A202C"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C05621"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F855A"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C53030"/>
    </marker>
  </defs>

  <rect width="960" height="900" fill="#FFFFFF"/>

  <!-- ============ (a) worker goroutines + channel ============ -->
  <text x="40" y="36" font-size="15" font-weight="700">(a) Worker goroutines send results through a channel</text>
  <text x="920" y="36" text-anchor="end" font-size="12" fill="#4A5568" font-family="Consolas, monospace">scratch/concurrency/main.go</text>

  <rect x="40" y="62" width="210" height="54" rx="6" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.4"/>
  <text x="145" y="84" text-anchor="middle" font-size="13.5" font-weight="700">worker goroutine 1</text>
  <text x="145" y="104" text-anchor="middle" font-size="12" font-family="Consolas, monospace">results &lt;- 1 * 1</text>
  <rect x="40" y="132" width="210" height="54" rx="6" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.4"/>
  <text x="145" y="154" text-anchor="middle" font-size="13.5" font-weight="700">worker goroutine 2</text>
  <text x="145" y="174" text-anchor="middle" font-size="12" font-family="Consolas, monospace">results &lt;- 2 * 2</text>
  <rect x="40" y="202" width="210" height="54" rx="6" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.4"/>
  <text x="145" y="224" text-anchor="middle" font-size="13.5" font-weight="700">worker goroutine 3</text>
  <text x="145" y="244" text-anchor="middle" font-size="12" font-family="Consolas, monospace">results &lt;- 3 * 3</text>
  <text x="145" y="278" text-anchor="middle" font-size="11.5" font-style="italic" fill="#4A5568">each worker calls defer wg.Done()</text>

  <line x1="252" y1="89" x2="368" y2="140" stroke="#1A202C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="252" y1="159" x2="368" y2="159" stroke="#1A202C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="252" y1="229" x2="368" y2="178" stroke="#1A202C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="282" y="90" text-anchor="middle" font-size="12" fill="#C05621">send</text>

  <rect x="370" y="117" width="220" height="84" rx="6" fill="#FEF3E8" stroke="#C05621" stroke-width="1.8"/>
  <text x="480" y="141" text-anchor="middle" font-size="14" font-weight="700" font-family="Consolas, monospace">results</text>
  <text x="480" y="161" text-anchor="middle" font-size="12.5">chan int (unbuffered)</text>
  <text x="480" y="181" text-anchor="middle" font-size="11.5" font-style="italic" fill="#4A5568">a send waits until main receives</text>

  <line x1="592" y1="159" x2="698" y2="159" stroke="#C05621" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="645" y="150" text-anchor="middle" font-size="12" fill="#C05621">receive</text>

  <rect x="700" y="117" width="220" height="84" rx="6" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.4"/>
  <text x="810" y="141" text-anchor="middle" font-size="13.5" font-weight="700">main goroutine</text>
  <text x="810" y="161" text-anchor="middle" font-size="12" font-family="Consolas, monospace">for r := range results</text>
  <text x="810" y="181" text-anchor="middle" font-size="11.5" font-style="italic" fill="#4A5568">printed 1, 9, 4: order varies</text>

  <rect x="370" y="232" width="220" height="50" rx="6" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="480" y="252" text-anchor="middle" font-size="13" font-weight="700">closer goroutine</text>
  <text x="480" y="271" text-anchor="middle" font-size="12" font-family="Consolas, monospace">wg.Wait(); close(results)</text>
  <line x1="480" y1="230" x2="480" y2="204" stroke="#1A202C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="602" y="253" font-size="11.5" fill="#4A5568">closes the channel when all workers</text>
  <text x="602" y="270" font-size="11.5" fill="#4A5568">finish, so the range loop in main ends</text>

  <line x1="40" y1="306" x2="920" y2="306" stroke="#A0AEC0" stroke-dasharray="6 5"/>

  <!-- ============ (b) HTTP requests + RWMutex ============ -->
  <text x="40" y="338" font-size="15" font-weight="700">(b) HTTP requests run concurrently in the application</text>
  <text x="920" y="338" text-anchor="end" font-size="12" fill="#4A5568" font-family="Consolas, monospace">net/http + repository/</text>

  <rect x="40" y="362" width="170" height="232" rx="6" fill="#F3F4F6" stroke="#4A5568" stroke-width="1.4"/>
  <text x="125" y="460" text-anchor="middle" font-size="14" font-weight="700">net/http server</text>
  <text x="125" y="482" text-anchor="middle" font-size="12" fill="#4A5568">starts a new goroutine</text>
  <text x="125" y="499" text-anchor="middle" font-size="12" fill="#4A5568">for every request</text>

  <rect x="270" y="362" width="260" height="60" rx="6" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.4"/>
  <text x="400" y="386" text-anchor="middle" font-size="13" font-weight="700">goroutine: GET /expenses</text>
  <text x="400" y="406" text-anchor="middle" font-size="12" font-family="Consolas, monospace">GetAll() → mu.RLock()</text>
  <rect x="270" y="448" width="260" height="60" rx="6" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.4"/>
  <text x="400" y="472" text-anchor="middle" font-size="13" font-weight="700">goroutine: GET /summary</text>
  <text x="400" y="492" text-anchor="middle" font-size="12" font-family="Consolas, monospace">GetAll() → mu.RLock()</text>
  <rect x="270" y="534" width="260" height="60" rx="6" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.4"/>
  <text x="400" y="558" text-anchor="middle" font-size="13" font-weight="700">goroutine: POST /expenses</text>
  <text x="400" y="578" text-anchor="middle" font-size="12" font-family="Consolas, monospace">Create() → mu.Lock()</text>

  <line x1="212" y1="430" x2="268" y2="392" stroke="#1A202C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="212" y1="478" x2="268" y2="478" stroke="#1A202C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="212" y1="526" x2="268" y2="564" stroke="#1A202C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="532" y1="392" x2="638" y2="440" stroke="#2F855A" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="532" y1="478" x2="638" y2="478" stroke="#2F855A" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="532" y1="564" x2="638" y2="516" stroke="#C53030" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="566" y="398" font-size="12" fill="#2F855A" font-weight="700">read</text>
  <text x="566" y="470" font-size="12" fill="#2F855A" font-weight="700">read</text>
  <text x="566" y="574" font-size="12" fill="#C53030" font-weight="700">write</text>

  <rect x="640" y="362" width="280" height="232" rx="6" fill="#EAF6EE" stroke="#2F855A" stroke-width="1.6"/>
  <text x="780" y="388" text-anchor="middle" font-size="13.5" font-weight="700" font-family="Consolas, monospace">InMemoryExpenseRepository</text>
  <line x1="640" y1="399" x2="920" y2="399" stroke="#2F855A"/>
  <text x="780" y="422" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace">expenses map[int]Expense</text>
  <text x="780" y="442" text-anchor="middle" font-size="12" fill="#4A5568">protected by mu sync.RWMutex</text>
  <rect x="656" y="456" width="248" height="38" rx="4" fill="#FFFFFF" stroke="#2F855A"/>
  <text x="780" y="472" text-anchor="middle" font-size="12" fill="#2F855A" font-weight="700">RLock: many readers at once</text>
  <text x="780" y="487" text-anchor="middle" font-size="11.5" fill="#4A5568">both GET requests run together</text>
  <rect x="656" y="502" width="248" height="38" rx="4" fill="#FFFFFF" stroke="#C53030"/>
  <text x="780" y="518" text-anchor="middle" font-size="12" fill="#C53030" font-weight="700">Lock: one writer, others wait</text>
  <text x="780" y="533" text-anchor="middle" font-size="11.5" fill="#4A5568">POST waits for the readers to finish</text>
  <text x="780" y="566" text-anchor="middle" font-size="11.5" font-style="italic" fill="#4A5568">defer mu.Unlock() always releases</text>
  <text x="780" y="582" text-anchor="middle" font-size="11.5" font-style="italic" fill="#4A5568">the lock when the method returns</text>

  <line x1="40" y1="618" x2="920" y2="618" stroke="#A0AEC0" stroke-dasharray="6 5"/>

  <!-- ============ (c) graceful shutdown ============ -->
  <text x="40" y="650" font-size="15" font-weight="700">(c) Graceful shutdown: a goroutine, a channel and select</text>
  <text x="920" y="650" text-anchor="end" font-size="12" fill="#4A5568" font-family="Consolas, monospace">main.go</text>

  <rect x="40" y="676" width="270" height="70" rx="6" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.4"/>
  <text x="175" y="699" text-anchor="middle" font-size="13" font-weight="700">server goroutine</text>
  <text x="175" y="719" text-anchor="middle" font-size="12" font-family="Consolas, monospace">serverErr &lt;- ListenAndServe()</text>
  <text x="175" y="736" text-anchor="middle" font-size="11.5" fill="#4A5568">chan error, buffered (size 1)</text>

  <rect x="40" y="790" width="270" height="70" rx="6" fill="#FEF3E8" stroke="#C05621" stroke-width="1.4"/>
  <text x="175" y="813" text-anchor="middle" font-size="13" font-weight="700">Ctrl+C: operating-system event</text>
  <text x="175" y="833" text-anchor="middle" font-size="12" font-family="Consolas, monospace">signal.NotifyContext(…)</text>
  <text x="175" y="850" text-anchor="middle" font-size="11.5" fill="#4A5568">closes the ctx.Done() channel</text>

  <rect x="380" y="726" width="200" height="84" rx="6" fill="#FFFFFF" stroke="#1A202C" stroke-width="1.8"/>
  <text x="480" y="750" text-anchor="middle" font-size="13.5" font-weight="700">main goroutine</text>
  <text x="480" y="771" text-anchor="middle" font-size="13" font-family="Consolas, monospace">select { … }</text>
  <text x="480" y="792" text-anchor="middle" font-size="11.5" fill="#4A5568">waits for the first event</text>

  <line x1="312" y1="711" x2="378" y2="750" stroke="#1A202C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="312" y1="825" x2="378" y2="786" stroke="#1A202C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="582" y1="750" x2="668" y2="711" stroke="#C53030" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <line x1="582" y1="786" x2="668" y2="825" stroke="#2F855A" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="795" y="669" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#C53030">case err := &lt;-serverErr:</text>
  <text x="795" y="880" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#2F855A">case &lt;-ctx.Done():</text>

  <rect x="670" y="676" width="250" height="70" rx="6" fill="#FFF5F5" stroke="#C53030" stroke-width="1.4"/>
  <text x="795" y="699" text-anchor="middle" font-size="13" font-weight="700">server could not start</text>
  <text x="795" y="719" text-anchor="middle" font-size="12" font-family="Consolas, monospace">log.Fatalf(…)</text>
  <text x="795" y="736" text-anchor="middle" font-size="11.5" fill="#4A5568">for example, port 8080 already in use</text>

  <rect x="670" y="790" width="250" height="70" rx="6" fill="#EAF6EE" stroke="#2F855A" stroke-width="1.4"/>
  <text x="795" y="813" text-anchor="middle" font-size="13" font-weight="700">graceful shutdown</text>
  <text x="795" y="833" text-anchor="middle" font-size="12" font-family="Consolas, monospace">server.Shutdown(ctx)</text>
  <text x="795" y="850" text-anchor="middle" font-size="11.5" fill="#4A5568">running requests get up to 5 s to finish</text>
</svg>
